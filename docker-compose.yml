services:
  # Redis 服务（缓存 + 限流 + 会话）
  redis:
    image: redis:7-alpine
    container_name: price-management-redis
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./redis-data:/data
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
        --dir /data
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save 3600 1
        --save 300 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: price-management-backend
    ports:
      - "8080:8080"
    network_mode: host
    environment:
      # 生产容器默认使用 prod profile，避免加载本地开发兜底配置
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      # 数据库配置（使用服务器上的MySQL）
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_NAME=price_management
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USE_SSL=true
      # Redis配置
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # 安全配置
      - JWT_SECRET=${JWT_SECRET}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}
      - RESET_PASSWORD_ON_STARTUP=false
      # 外部 API 配置
      - API_KEY_ENABLED=${API_KEY_ENABLED:-false}
      # 外部 API Secret 加密主密钥（Base64 编码 32 字节）
      - API_KEY_ENCRYPTION_KEY=${API_KEY_ENCRYPTION_KEY}
      - API_KEY_ENCRYPTION_KEY_VERSION=${API_KEY_ENCRYPTION_KEY_VERSION:-v1}
      # 告警配置
      - ALERT_ENABLED=false
      - ALERT_DINGTALK_ENABLED=false
      - ALERT_DINGTALK_WEBHOOK=
      - ALERT_DINGTALK_SECRET=
      - ALERT_WECHAT_ENABLED=false
      - ALERT_WECHAT_WEBHOOK=
      - ALERT_THRESHOLD_MEMORY=90.0
      - ALERT_THRESHOLD_CPU=80.0
      # Java配置
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC
    volumes:
      - ./logs:/app/logs
      - logo-data:/app/data/logos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: price-management-frontend
    ports:
      - "80:80"        # H5 前端（保留，可选）
      - "443:443"      # 正式 HTTPS：PC端 + 微信小程序
      - "32080:32080"  # 正式 HTTPS 入口：PC端 + 微信小程序
      - "32801:32801"  # 内网正式 HTTP 入口
    volumes:
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - price-network

networks:
  price-network:
    driver: bridge

volumes:
  logo-data:
