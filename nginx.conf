# =====================================================
# 价格管理系统 - Nginx 配置
# 统一端口架构：
# - 端口 443: price.jlmining.com 正式 HTTPS 入口
# - 端口 32080: 正式 HTTPS 入口（PC端 + 微信小程序）
# - 端口 32801: 内网正式 HTTP 入口
# - 端口 80: 保留（可选，内网 HTTP 入口）
# =====================================================

# 明确攻击特征拦截：JNDI/LDAP/RMI/log4j、${...} 及路径穿越。
# 只命中高置信恶意请求，正常业务不应携带这些片段。
# v2.1.0 2026-06-16 修复：用单一 regex 同时排除 /assets/ 静态资源 + 命中攻击特征
# nginx map 行为：每个规则都会被评估，最后一条匹配的规则决定最终值
map $request_uri $security_blocked {
    default 0;
    # 第一步：标记所有含攻击特征的请求
    ~*(jndi|ldap|rmi|log4j|\$\{|%24%7B|\.\./|\.\.%2f|%2e%2e) 1;
    # 第二步：排除 /assets/ 静态资源（Vite 构建产物可能含 "rmi" 等子串）
    # 这一步必须写在后面，覆盖第一步对 /assets/ 的标记
    ~^/assets/ 0;
}

# 分层限流配置（v2.1.0 安全加固，2026-06-16 引入）
# v1.1 Phase 2.2：先观察 48h，再启用强制（默认 dry_run）
# 阈值依据：PC端日常使用峰值 < 10 r/s，留 3x 余量
limit_req_zone $binary_remote_addr zone=api_global:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# 启停开关：dry_run=on 仅记录到 error_log 不拒绝；off 强制 444
# v1.1 上线第一周建议 dry_run=on
limit_req_dry_run on;

# 拒绝通过 IP 或未配置域名访问 HTTPS，避免误入价格系统
server {
    listen 443 ssl default_server;
    server_name _;

    if ($security_blocked) { return 444; }

    ssl_certificate /etc/nginx/certs/price.jlmining.com.pem;
    ssl_certificate_key /etc/nginx/certs/price.jlmining.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# 正式 HTTPS 入口，由价格管理系统独立 Nginx 终止 TLS
server {
    listen 443 ssl;
    server_name price.jlmining.com;
    server_tokens off;

    if ($security_blocked) { return 444; }

    ssl_certificate /etc/nginx/certs/price.jlmining.com.pem;
    ssl_certificate_key /etc/nginx/certs/price.jlmining.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PRICE_SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 登录接口单独限流（更严格）
    location ^~ /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://host.docker.internal:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# 主服务器 - 统一 HTTPS 入口（端口 32080）
# 微信小程序 request 合法域名使用 https://price.jlmining.com:32080
server {
    listen 32080 ssl;
    server_name price.jlmining.com;
    server_tokens off;

    if ($security_blocked) { return 444; }

    ssl_certificate /etc/nginx/certs/price.jlmining.com.pem;
    ssl_certificate_key /etc/nginx/certs/price.jlmining.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PRICE_32080_SSL:10m;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # API 代理到后端
    location ^~ /api/ {
        limit_req zone=api_global burst=100 nodelay;
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # CORS 配置（小程序和跨域访问需要）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # 预检请求处理
        if ($request_method = OPTIONS) {
            return 204;
        }

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 登录接口单独限流（更严格）
    location ^~ /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://host.docker.internal:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket 支持
    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端路由 - SPA 支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# 内网正式 HTTP 入口：80 / 32801
server {
    listen 80;
    listen 32801;
    server_name localhost;

    if ($security_blocked) { return 444; }

    # 方案1：重定向到 32080
    # return 301 http://$host:32080$request_uri;

    # 方案2：独立服务（当前配置）
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        limit_req zone=api_global burst=100 nodelay;
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 登录接口单独限流（更严格）
    location ^~ /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://host.docker.internal:8080/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 登录接口单独限流（更严格）—— 80/32801 块在行 239 已加，这里不重复

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
