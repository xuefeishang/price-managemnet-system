# =====================================================
# 价格管理系统 - Nginx 配置
# 统一端口架构：
# - 端口 443: price.jlmining.com 正式 HTTPS 入口
# - 端口 32080: 正式 HTTPS 入口（PC端 + 微信小程序）
# - 端口 32801: 内网正式 HTTP 入口
# - 端口 80: 保留（可选，内网 HTTP 入口）
# =====================================================

# 拒绝通过 IP 或未配置域名访问 HTTPS，避免误入价格系统
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/price.jlmining.com.pem;
    ssl_certificate_key /etc/nginx/certs/price.jlmining.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# 正式 HTTPS 入口，由价格管理系统独立 Nginx 终止 TLS
server {
    listen 443 ssl;
    server_name price.jlmining.com;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/price.jlmining.com.pem;
    ssl_certificate_key /etc/nginx/certs/price.jlmining.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PRICE_SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# 主服务器 - 统一 HTTPS 入口（端口 32080）
# 微信小程序 request 合法域名使用 https://price.jlmining.com:32080
server {
    listen 32080 ssl;
    server_name price.jlmining.com;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/price.jlmining.com.pem;
    ssl_certificate_key /etc/nginx/certs/price.jlmining.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PRICE_32080_SSL:10m;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # API 代理到后端
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # CORS 配置（小程序和跨域访问需要）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        # 预检请求处理
        if ($request_method = OPTIONS) {
            return 204;
        }

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 支持
    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端路由 - SPA 支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# 内网正式 HTTP 入口：80 / 32801
server {
    listen 80;
    listen 32801;
    server_name localhost;

    # 方案1：重定向到 32080
    # return 301 http://$host:32080$request_uri;

    # 方案2：独立服务（当前配置）
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass http://host.docker.internal:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
