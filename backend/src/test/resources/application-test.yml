server:
  port: 8080

spring:
  application:
    name: price-management-system-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      repositories:
        enabled: false

jwt:
  secret: test-secret-key-for-unit-testing-minimum-256-bits-required
  expiration: 86400000

security:
  default-user-password: test123456
  reset-password-on-startup: false
  cors-allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

api-key:
  enabled: true
  encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  encryption-key-version: test
