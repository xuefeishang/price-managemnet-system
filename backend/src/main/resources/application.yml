server:
  port: 8080

spring:
  application:
    name: price-management-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:price_management}?useUnicode=true&characterEncoding=utf8&useSSL=${DB_USE_SSL:true}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Existing local/prod databases before Flyway auto-configuration already contain V1-V12 schema.
    # When such non-empty databases are first brought under Flyway control, baseline them at V12,
    # then run V13+ migrations. Empty databases still execute all migrations from V1.
    baseline-version: 12
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:10.7.5.175}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      timeout: 5000ms
      repositories:
        enabled: false
      # 连接池配置
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis

# 安全配置（敏感配置集中管理）
security:
  jwt-secret: ${JWT_SECRET}
  jwt-expiration: ${JWT_EXPIRATION:86400000}
  # 默认用户密码（重要：生产环境必须修改）
  default-user-password: ${DEFAULT_USER_PASSWORD}
  # 是否在启动时重置默认用户密码（生产环境建议设为false）
  reset-password-on-startup: ${RESET_PASSWORD_ON_STARTUP:false}
  # CORS允许的来源（生产环境必须配置具体域名，不配置时仅允许本地开发来源）
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  password-policy:
    min-length: ${PASSWORD_MIN_LENGTH:8}
    max-length: ${PASSWORD_MAX_LENGTH:32}
    require-letter: ${PASSWORD_REQUIRE_LETTER:true}
    require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
    disallow-whitespace: ${PASSWORD_DISALLOW_WHITESPACE:true}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.pricemanagement: info
    org.springframework.security: warn

# 告警配置
alert:
  enabled: ${ALERT_ENABLED:false}
  ding-talk:
    enabled: ${ALERT_DINGTALK_ENABLED:false}
    webhook: ${ALERT_DINGTALK_WEBHOOK:}
    secret: ${ALERT_DINGTALK_SECRET:}
  we-chat:
    enabled: ${ALERT_WECHAT_ENABLED:false}
    webhook: ${ALERT_WECHAT_WEBHOOK:}
  threshold:
    memory-usage: ${ALERT_THRESHOLD_MEMORY:90.0}
    cpu-usage: ${ALERT_THRESHOLD_CPU:80.0}

# 外部 API Key 授权配置。默认关闭，启用后仅影响 /api/external/**
api-key:
  enabled: ${API_KEY_ENABLED:true}
  encryption-key: ${API_KEY_ENCRYPTION_KEY:}
  encryption-key-version: ${API_KEY_ENCRYPTION_KEY_VERSION:v1}
  timestamp-window-seconds: ${API_KEY_TIMESTAMP_WINDOW_SECONDS:300}
  nonce-ttl-seconds: ${API_KEY_NONCE_TTL_SECONDS:600}
  cache-ttl-seconds: ${API_KEY_CACHE_TTL_SECONDS:300} # 预留：第一阶段授权元数据实时查库
  log:
    retention-days: ${API_KEY_LOG_RETENTION_DAYS:180}
    auth-failure-sample-rate: ${API_KEY_LOG_AUTH_FAILURE_SAMPLE_RATE:1.0}
    max-error-message-length: ${API_KEY_LOG_MAX_ERROR_MESSAGE_LENGTH:500}
    max-query-length: ${API_KEY_LOG_MAX_QUERY_LENGTH:1000}

# 通知中心可靠投递配置
notification:
  outbox:
    enabled: ${NOTIFICATION_OUTBOX_ENABLED:true}
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:20}
    max-retries: ${NOTIFICATION_OUTBOX_MAX_RETRIES:3}
    lock-seconds: ${NOTIFICATION_OUTBOX_LOCK_SECONDS:120}
    poll-delay-ms: ${NOTIFICATION_OUTBOX_POLL_DELAY_MS:30000}
  notice:
    poll-delay-ms: ${NOTIFICATION_NOTICE_POLL_DELAY_MS:60000}
  webhook:
    enabled: ${NOTIFICATION_WEBHOOK_ENABLED:false}
    url: ${NOTIFICATION_WEBHOOK_URL:}
    secret: ${NOTIFICATION_WEBHOOK_SECRET:}
    timeout-ms: ${NOTIFICATION_WEBHOOK_TIMEOUT_MS:5000}
  mini-program:
    enabled: ${WECHAT_MINI_NOTIFY_ENABLED:false}
    eligibility-reconcile-cron: "${WECHAT_MINI_ELIGIBILITY_RECONCILE_CRON:0 30 3 * * ?}"
    app-id: ${WECHAT_MINI_APP_ID:}
    app-secret: ${WECHAT_MINI_APP_SECRET:}
    timeout-ms: ${WECHAT_MINI_NOTIFY_TIMEOUT_MS:5000}
    token-url: ${WECHAT_MINI_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
    send-url: ${WECHAT_MINI_SEND_URL:https://api.weixin.qq.com/cgi-bin/message/subscribe/send}
    default-page: ${WECHAT_MINI_DEFAULT_PAGE:pages/notifications/index}
    templates:
      PRICE_PUBLISHED:
        template-id: ${WECHAT_MINI_TEMPLATE_PRICE_PUBLISHED:}
        page: ${WECHAT_MINI_PRICE_PAGE:pages/home/index}
        fields:
          type: ${WECHAT_MINI_PRICE_FIELD_TYPE:phrase2}
          tip: ${WECHAT_MINI_PRICE_FIELD_TIP:thing4}
      SYSTEM_NOTICE:
        template-id: ${WECHAT_MINI_TEMPLATE_SYSTEM_NOTICE:}
        page: ${WECHAT_MINI_NOTICE_PAGE:pages/notifications/index}
        fields:
          creator: ${WECHAT_MINI_NOTICE_FIELD_CREATOR:thing1}
          time: ${WECHAT_MINI_NOTICE_FIELD_TIME:time2}

# Actuator 健康检查配置
management:
  health:
    redis:
      enabled: false  # Redis 健康检查不阻止应用启动
