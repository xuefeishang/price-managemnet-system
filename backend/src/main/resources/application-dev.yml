# 本地开发环境配置
# 使用方式：spring.profiles.active=dev

server:
  servlet:
    session:
      persistent: false
  tomcat:
    basedir: ${TOMCAT_BASEDIR:./target/tomcat}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/price_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Root@2026}

  # Redis 配置（可选）
  # 如果 Redis 可用则使用 Redis 缓存，否则自动降级为内存缓存
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  # 缓存配置：设置为 redis 时优先使用 Redis
  # 如果 Redis 连接失败，会自动降级为内存缓存
  cache:
    type: redis

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 安全配置（仅本地开发使用默认值）
security:
  jwt-secret: ${JWT_SECRET:price-management-system-dev-secret-key-2024}
  default-user-password: ${DEFAULT_USER_PASSWORD:admin123}
  reset-password-on-startup: ${RESET_PASSWORD_ON_STARTUP:true}

jwt:
  secret: ${JWT_SECRET:price-management-system-dev-secret-key-2024}

logging:
  level:
    com.pricemanagement: debug
    org.springframework.security: debug

# 外部 API Key 本地开发兜底配置。
# 生产环境必须通过 API_KEY_ENCRYPTION_KEY 注入独立随机值，不能使用该开发示例 key。
api-key:
  encryption-key: ${API_KEY_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  encryption-key-version: ${API_KEY_ENCRYPTION_KEY_VERSION:dev}
