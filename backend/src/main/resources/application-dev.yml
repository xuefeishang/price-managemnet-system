# 本地开发环境配置
# 使用方式：spring.profiles.active=dev

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/price_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Root@2026

  # Redis 配置（可选）
  # 如果 Redis 可用则使用 Redis 缓存，否则自动降级为内存缓存
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: 123abc

  # 缓存配置：设置为 redis 时优先使用 Redis
  # 如果 Redis 连接失败，会自动降级为内存缓存
  cache:
    type: redis

# 安全配置（仅本地开发使用默认值）
security:
  jwt-secret: price-management-system-dev-secret-key-2024
  default-user-password: admin123
  reset-password-on-startup: true

jwt:
  secret: price-management-system-dev-secret-key-2024
